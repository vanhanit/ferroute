[workspace]
resolver = "3"
members = [
    "crates/ferroute-geom",
    "crates/ferroute-board",
    "crates/ferroute-kicad",
    "crates/ferroute-dsn",
    "crates/ferroute-drc",
    "crates/ferroute-router",
    "crates/ferroute-place",
    "crates/ferroute-render",
    "crates/ferroute-ipc",
    "crates/ferroute-gpu",
    "crates/ferroute-engine",
    "crates/ferroute-cli",
]
default-members = [
    "crates/ferroute-geom",
    "crates/ferroute-board",
    "crates/ferroute-kicad",
    "crates/ferroute-dsn",
    "crates/ferroute-drc",
    "crates/ferroute-router",
    "crates/ferroute-place",
    "crates/ferroute-render",
    "crates/ferroute-ipc",
    "crates/ferroute-gpu",
    "crates/ferroute-engine",
    "crates/ferroute-cli",
]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
authors = ["Thomas Vanhaniemi", "ferroute contributors"]
repository = "https://github.com/vanhanit/ferroute"
keywords = ["pcb", "kicad", "autorouter", "eda", "routing"]
categories = ["science", "command-line-utilities"]

[workspace.dependencies]
# Internal crates
ferroute-geom = { path = "crates/ferroute-geom", version = "0.9.1" }
ferroute-board = { path = "crates/ferroute-board", version = "0.9.1" }
ferroute-kicad = { path = "crates/ferroute-kicad", version = "0.9.1" }
ferroute-dsn = { path = "crates/ferroute-dsn", version = "0.9.1" }
ferroute-drc = { path = "crates/ferroute-drc", version = "0.9.1" }
ferroute-router = { path = "crates/ferroute-router", version = "0.9.1" }
ferroute-place = { path = "crates/ferroute-place", version = "0.9.1" }
ferroute-render = { path = "crates/ferroute-render", version = "0.9.1" }
ferroute-ipc = { path = "crates/ferroute-ipc", version = "0.9.1" }
ferroute-gpu = { path = "crates/ferroute-gpu", version = "0.9.1" }
ferroute-engine = { path = "crates/ferroute-engine", version = "0.9.1" }

# Third-party (minimums = latest stable on crates.io at setup time, 2026-11-19;
# exact versions are pinned by the committed Cargo.lock and bumped by Renovate).
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
pollster = "1.0.3"
proptest = "1.12.0"
prost = "0.14.6"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
smallvec = { version = "1.16.6", features = ["union", "const_generics"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wgpu = "30.0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
float_cmp = "warn"
cast_lossless = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# Property tests are CPU-heavy; keep test builds reasonably optimised.
[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
