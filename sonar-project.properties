sonar.projectKey=vanhanit_ferroute
sonar.projectName=ferroute
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=crates
sonar.tests=crates
sonar.test.inclusions=**/tests/**,**/benches/**
sonar.exclusions=**/target/**,out/**,dist/**,node_modules/**
sonar.coverage.exclusions=**/tests/**,**/benches/**,crates/ferroute-bench/**

# Native Rust analysis. Reports are produced by `make sonar` / the CI sonar job:
#   cargo llvm-cov --workspace --lcov --output-path out/lcov.info
#   cargo clippy --workspace --all-targets --message-format=json > out/clippy.json
sonar.rust.lcov.reportPaths=out/lcov.info
# The SonarQube docs name this property sonar.rust.clippy.reportPaths, but Sonar staff
# confirmed (community thread, RUST-115) the analyzer actually reads sonar.rust.clippyReport.reportPaths.
# Both are set; the unused one is ignored.
sonar.rust.clippy.reportPaths=out/clippy.json
sonar.rust.clippyReport.reportPaths=out/clippy.json
