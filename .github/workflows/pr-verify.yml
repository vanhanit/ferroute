name: pr-verify

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci || npm install --no-audit --no-fund
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx --no-install commitlint --config commitlint.config.mjs --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --config commitlint.config.mjs --verbose
      - name: Lint merge-group head commit
        if: github.event_name == 'merge_group'
        run: npx --no-install commitlint --config commitlint.config.mjs --last --verbose
