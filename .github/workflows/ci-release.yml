name: ci-release

on:
  push:
    branches: [main]
    # Docs- or CI-only pushes never version or release (code changes are verified by
    # pr-verify on pull requests; the nightly workflow exercises the workflows too).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

concurrency:
  group: ci-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/vanhanit/ferroute

jobs:
  verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  release:
    needs: verify
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # push the release commit + tag
    outputs:
      released: ${{ steps.next.outputs.released }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - name: Compute next version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last_tag" ]; then
            # First release: publish the version already in Cargo.toml.
            version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            echo "No previous tag; first release is $version"
            range="HEAD"
          else
            range="$last_tag..HEAD"
            subjects=$(git log "$range" --format='%s' --invert-grep --grep='^chore(release):')
            bodies=$(git log "$range" --format='%b' --invert-grep --grep='^chore(release):')
            if ! { grep -Eq '^(feat|fix|perf)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:' <<<"$subjects" \
                   || grep -q '^BREAKING[ -]CHANGE' <<<"$bodies"; }; then
              echo "No releasable commits since $last_tag; skipping."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            bumped=$(git cliff --config cliff.toml --bumped-version)
            version=${bumped#v}
            if [ "v$version" = "$last_tag" ]; then
              echo "Bumped version equals current ($last_tag); skipping."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          tag="v$version"
          echo "Releasing $tag"
          {
            echo "released=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Update version, lockfile, changelog
        if: steps.next.outputs.released == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.next.outputs.version }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/bump_version.sh "$VERSION"
          git cliff --config cliff.toml --unreleased --tag "$TAG" --strip header -o release-notes.md
          git cliff --config cliff.toml --tag "$TAG" -o CHANGELOG.md
          cat release-notes.md

      - name: Commit, tag, push
        if: steps.next.outputs.released == 'true'
        shell: bash
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "$TAG" -m "ferroute ${TAG}"
          # Branch and tag land together or not at all (--atomic). If main moved meanwhile,
          # rebase the release commit onto it, re-tag and retry: a partial push once left an
          # orphan v0.4.0 tag that blocked every later release.
          for attempt in 1 2 3 4 5; do
            if git push --atomic origin HEAD:main "$TAG"; then
              exit 0
            fi
            echo "::warning::main moved; rebasing release commit (attempt ${attempt})"
            git fetch origin main
            git tag -d "$TAG"
            git rebase origin/main
            git tag -a "$TAG" -m "ferroute ${TAG}"
            sleep $((attempt * 5))
          done
          echo "::error::could not push ${TAG} atomically"
          exit 1

      - name: Keep release notes
        if: steps.next.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # All release binaries are cross-compiled from Linux inside the Docker `cross` stage
  # (cargo-zigbuild; zig as the cross linker). Native macOS/Windows runners are only used
  # for running the test-suite (verify.yml), not for producing artifacts.
  binaries:
    name: binaries (cross-compiled in Linux container)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - name: Build cross-compilation image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: cross
          load: true
          tags: ferroute-cross:ci
          cache-from: type=gha,scope=cross
          cache-to: type=gha,mode=max,scope=cross
      - name: Cross-compile and package every target
        run: docker run --rm -v "$PWD":/work -w /work ferroute-cross:ci scripts/dist.sh "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: ferroute-binaries
          path: dist/*
          if-no-files-found: error

  container:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/vanhanit/ferroute
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [release, binaries, container]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ferroute-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          cd assets && cat ./*.sha256 > SHA256SUMS && cd ..
          ls -l assets
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ferroute $TAG" --notes-file notes/release-notes.md
