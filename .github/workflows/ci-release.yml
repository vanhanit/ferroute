name: ci-release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/vanhanit/ferroute

jobs:
  verify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  release:
    needs: verify
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # push the release commit + tag
    outputs:
      released: ${{ steps.next.outputs.released }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - name: Compute next version
        id: next
        shell: bash
        run: |
          set -euo pipefail
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last_tag" ]; then
            # First release: publish the version already in Cargo.toml.
            version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            echo "No previous tag; first release is $version"
            range="HEAD"
          else
            range="$last_tag..HEAD"
            subjects=$(git log "$range" --format='%s' --invert-grep --grep='^chore(release):')
            bodies=$(git log "$range" --format='%b' --invert-grep --grep='^chore(release):')
            if ! { grep -Eq '^(feat|fix|perf)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:' <<<"$subjects" \
                   || grep -q '^BREAKING[ -]CHANGE' <<<"$bodies"; }; then
              echo "No releasable commits since $last_tag; skipping."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            bumped=$(git cliff --config cliff.toml --bumped-version)
            version=${bumped#v}
            if [ "v$version" = "$last_tag" ]; then
              echo "Bumped version equals current ($last_tag); skipping."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          tag="v$version"
          echo "Releasing $tag"
          {
            echo "released=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Update version, lockfile, changelog
        if: steps.next.outputs.released == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.next.outputs.version }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          sed -i '/^\[workspace.package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          cargo update --workspace
          git cliff --config cliff.toml --unreleased --tag "$TAG" --strip header -o release-notes.md
          git cliff --config cliff.toml --tag "$TAG" -o CHANGELOG.md
          cat release-notes.md

      - name: Commit, tag, push
        if: steps.next.outputs.released == 'true'
        shell: bash
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "$TAG" -m "ferroute ${TAG}"
          git push origin HEAD:main "$TAG"

      - name: Keep release notes
        if: steps.next.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  binaries:
    name: binary (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p ferroute-cli
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          name="ferroute-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/ferroute${EXT}" "dist/$name/"
          cp LICENSE NOTICE COMMERCIAL.md README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          cat "$archive.sha256"
          rm -rf "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ferroute-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  container:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/vanhanit/ferroute
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [release, binaries, container]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ferroute-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          cd assets && cat ./*.sha256 > SHA256SUMS && cd ..
          ls -l assets
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ferroute $TAG" --notes-file notes/release-notes.md
