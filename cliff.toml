# git-cliff 2.14 configuration: https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

All notable changes to ferroute are documented here. Generated by git-cliff from Conventional Commits.
"""
body = """
{%- macro remote_url() -%}https://github.com/vanhanit/ferroute{%- endmacro -%}
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^revert", group = "<!-- 8 -->Reverted" },
  { message = "^style", group = "<!-- 9 -->Style" },
  { message = "^chore", group = "<!-- 10 -->Chores" },
]

[bump]
# While < 1.0: breaking changes bump minor (features_always_bump_minor stays true; breaking does
# not force 1.0.0). Set breaking_always_bump_major = true when the project reaches 1.0.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.1.0"
